name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build scratch-gui
        run: npm run build
        env:
          NODE_ENV: production
          ROUTING_STYLE: hash

      - name: Replace green flag assets (post-build patch)
        run: |
          curl -L https://cattymod.app/assets/go-icon/play/flag.svg -o /tmp/green-flag.svg
          find ./build -type f -name "green-flag*.svg" -exec cp /tmp/green-flag.svg {} \;
          rm /tmp/green-flag.svg

      - name: Fix artifact permissions
        run: chmod -R +rwx ./build/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/

      # NEW: Prepare build branch
      - name: Publish build branch
        run: |
          cd build

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b build

          git add .
          git commit -m "Latest build from $GITHUB_SHA"

          git push --force \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

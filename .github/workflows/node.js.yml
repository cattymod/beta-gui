name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # FIX: do NOT use npm ci in Scratch forks
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build scratch-gui
        run: npm run build
        env:
          NODE_ENV: production
          ROUTING_STYLE: hash

      - name: Replace green flag assets (post-build patch)
        run: |
          find ./build -type f -exec sed -i 's|/static/blocks-media/default/green-flag.svg|https://cattymod.app/editor/static/blocks-media/blue-flag.svg|g' {} +
          find ./build -type f -exec sed -i 's|/static/blocks-media/high-contrast/green-flag.svg|https://cattymod.app/editor/static/blocks-media/blue-flag.svg|g' {} +

      - name: Fix artifact permissions
        run: chmod -R +rwx ./build/

      # ✅ NEW: push build to desktop branch
      - name: Deploy Desktop Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: build
          force_orphan: true

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

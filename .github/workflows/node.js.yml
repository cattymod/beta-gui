name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [develop]

# Required permissions for branchless deployment via OIDC tokens
permissions:
  contents: read
  pages: write
  id-token: write

# Cancels intermediate builds if you push new code rapidly
concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build scratch-gui
      run: npm run build
      env:
        NODE_ENV: production
        ROUTING_STYLE: hash

    # Crucial step: Standardizes file permissions so GitHub Pages backend can extract it
    - name: Fix artifact permissions
      run: chmod -R +rwx ./build/

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./build/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
